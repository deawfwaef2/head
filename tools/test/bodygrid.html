<!doctype html><meta charset="utf-8"><title>body grid</title><base href="/">
<!-- R53：身体目检台（无头）。?list=VH_a,VH_b,... 每个从 big/body/<n>.js 取，横排渲染到 #cv，窗口 __ready=true 后截图。用于给 VH_* 身体分类/质检。 -->
<body style="margin:0;background:#222"><canvas id="cv" width="1200" height="520"></canvas>
<script src="/lib/three.min.js"></script><script src="/lib/GLTFLoader.js"></script>
<script>
const q = new URLSearchParams(location.search), L = (q.get('list') || '').split(',').filter(Boolean);
window.BODY_MODELS = window.BODY_MODELS || {};
(async () => {
  const R = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), antialias: true, preserveDrawingBuffer: true }); R.setSize(1200, 520, false); R.outputEncoding = THREE.sRGBEncoding;
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0x59626c); sc.add(new THREE.HemisphereLight(0xffffff, 0x8a8078, 1.3)); const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1, 2, 3); sc.add(dl);
  const n = L.length, W = 1.15; const info = [];
  for (let i = 0; i < n; i++) {
    await new Promise(r => { const s = document.createElement('script'); s.src = '/big/body/' + L[i] + '.js'; s.onload = r; s.onerror = r; document.head.appendChild(s); });
    const E = BODY_MODELS[L[i]]; if (!E) { info.push(L[i] + ':missing'); continue; }
    const bin = atob(E.glb), u = new Uint8Array(bin.length); for (let k = 0; k < bin.length; k++) u[k] = bin.charCodeAt(k);
    const g = await new Promise((res, rej) => new THREE.GLTFLoader().parse(u.buffer, '', res, rej));
    const o = g.scene; o.position.x = (i - (n - 1) / 2) * W; sc.add(o);
    o.traverse(m => { if (m.isMesh && m.material && m.material.map) m.material.map.encoding = THREE.sRGBEncoding; });
    const bb = new THREE.Box3().setFromObject(o); info.push(L[i] + ' h=' + (bb.max.y - bb.min.y).toFixed(2) + ' w=' + (bb.max.x - bb.min.x).toFixed(2));
  }
  const cam = new THREE.PerspectiveCamera(30, 1200 / 520, 0.1, 50); const span = n * W; cam.position.set(0, 0.8, Math.max(4.2, span * 0.9 * 520 / 1200 / Math.tan(15 * Math.PI / 180) * 0.62)); cam.lookAt(0, 0.8, 0);
  R.render(sc, cam); window.__info = info; window.__ready = true;
})();
</script>
