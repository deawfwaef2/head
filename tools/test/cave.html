<!doctype html><meta charset="utf-8"><title>cave cozy harness</title><base href="/">
<body style="margin:0;background:#000"><canvas id="cv" width="960" height="540"></canvas>
<script src="/lib/three.min.js"></script><script src="/js/mods.js"></script><script src="/js/assets.js"></script><script src="/assets/img_fire.js"></script><script src="/assets/rock_face_01.js"></script><script src="/assets/rock_moss_set_02.js"></script><script src="/assets/stone_fire_pit.js"></script><script src="/assets/tex_dark_rock.js"></script><script src="/assets/tex_rock_ground.js"></script><script src="/assets/wooden_lantern_01.js"></script><script src="/assets/garden_gnome.js"></script><script src="/js/builds.js"></script><script src="/js/cave.js"></script>
<script>
// 轻量洞穴测试台：?cz=0 旧版，1 新版。复刻 game.js 的灯光参数。window.shot(view) 设相机后渲染。
const CZ = location.search.indexOf('cz=0') < 0; { const o = Mods.on; Mods.on = id => id === 'cave_cozy' ? CZ : o(id); }
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('cv'), preserveDrawingBuffer: true, antialias: true });
renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = CZ ? 1.3 : 1.15;
const scene = new THREE.Scene(); scene.background = new THREE.Color(CZ ? '#2c2119' : '#0e0a08'); scene.fog = new THREE.FogExp2(CZ ? '#3a2c21' : '#140e0a', CZ ? 0.026 * 1 : 0.045);
scene.add(CZ ? new THREE.HemisphereLight(0xffe2c0, 0x6a5240, 1.0) : new THREE.HemisphereLight(0x8a7a6a, 0x201510, 0.55));
const camera = new THREE.PerspectiveCamera(75, 16 / 9, 0.05, 200);
let cave;
const fl = new THREE.PointLight(CZ ? 0xffb468 : 0xff8a3a, CZ ? 2.7 * 1.08 : 2.4 * 0.85, CZ ? 16 : 12, 1.6); fl.position.set(0, 0.95, 0); scene.add(fl);
const ex = CZ ? new THREE.PointLight(0xfff4dc, 2.6, 14, 1.4) : new THREE.PointLight(0xfff0d0, 1.4, 10, 1.5); scene.add(ex);
window.G = { camera };
Assets.init(() => {}).then(() => { cave = Cave.build(scene, 12, 0); fl.position.set(0, .95, 0); ex.position.copy(cave.exitPos).add(new THREE.Vector3(0, 1.5, 1)); window.ready = true; });
window.shot = (x, y, z, tx, ty, tz) => { camera.position.set(x, y, z); camera.lookAt(tx, ty, tz); if (cave.update) cave.update(1); renderer.render(scene, camera); renderer.render(scene, camera); return cave.exitPos.toArray().join(',') + ' H=' + cave.H; };
</script>
