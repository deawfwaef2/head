<!doctype html><html><body style="margin:0;background:#222;color:#eee;font:12px sans-serif">
<!-- 第二十六轮(k) 测试：九座霸主首级合成器的外观（假 G / 假首级：球 + 红鼻子表示朝向）。#poke 看 E 督工动画 -->
<div id="grid" style="display:flex;flex-wrap:wrap;gap:2px"></div>
<script src="../../lib/three.min.js"></script><script src="../../lib/GLTFLoader.js"></script>
<script src="../../js/mods.js"></script><script src="../../js/assets.js"></script>
<script>['wooden_axe_02','wicker_basket_01','planter_box_01','flower_ursinia','watering_can_metal_01','namaqualand_boulder_02','bull_head','lion_head','horse_head','GothicCommode_01','brass_candleholders','wooden_bucket_02','stone_fire_pit','brass_pot_01','wine_barrel_01','stone_01','ornate_war_hammer','wooden_ladder','img_fire'].forEach(n=>document.write(`<script src="../../assets/${n}.js"><\/script>`));</script>
<script src="../../models/props_pack.js"></script><script src="../../js/sanctum.js"></script>
<script>
const V3=THREE.Vector3; window.BuildCat={C:{}}; const IT={};
window.Sack={IT,def:(id,o)=>IT[id]=Object.assign({id},o),mk:(id,n)=>({id,n}),have:()=>0,take(){},stashAdd(o){window.__got=(window.__got||0)+o.n;},RECIPES:[]};
window.G={builds:[],HOOK:{frame:[],e:[],tip:[]},S:{coins:1e6,bosses:{}},burst(){},floatText(t){window.__ft=t;},toast(t){window.__toast=t;},flash(){},player:{pos:new V3(0,0,3)},clock:{elapsedTime:0},held:null};
</script>
<script src="../../js/regecon.js"></script>
<script>
(async()=>{
  await Assets.init(); await PropModels.init();
  const POKE=location.hash.includes('poke');
  const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); R.setSize(320,320); R.outputEncoding=THREE.sRGBEncoding; R.shadowMap.enabled=true;
  const ONLY=(location.hash.match(/only=([a-z,]+)/)||[])[1]; console.log('RES flowers '+JSON.stringify(Assets.names('flower_ursinia')));
  for(const k of Object.keys(RegEcon.MACH).filter(k=>!ONLY||ONLY.split(',').includes(k))){
    const sc=new THREE.Scene(); sc.background=new THREE.Color('#3a3530'); sc.add(new THREE.HemisphereLight('#fff','#443',1.0)); const dl=new THREE.DirectionalLight('#fff',1.3); dl.position.set(2,4,3); dl.castShadow=true; sc.add(dl);
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshStandardMaterial({color:'#5a5048'})); fl.rotation.x=-Math.PI/2; fl.receiveShadow=true; sc.add(fl);
    const d=BuildCat.C['syn_'+k], g=d.make(); sc.add(g);
    const hg=new THREE.Group(); const sp=new THREE.Mesh(new THREE.SphereGeometry(0.15,20,14),new THREE.MeshStandardMaterial({color:'#e8c0a8'})); sp.position.y=0.17; hg.add(sp);
    const hair=new THREE.Mesh(new THREE.SphereGeometry(0.16,20,14,0,Math.PI*2,0,1.3),new THREE.MeshStandardMaterial({color:'#c89040'})); hair.position.y=0.19; hg.add(hair);
    const nose=new THREE.Mesh(new THREE.ConeGeometry(0.03,0.08,8),new THREE.MeshStandardMaterial({color:'#d22'})); nose.rotation.x=Math.PI/2; nose.position.set(0,0.16,0.16); hg.add(nose); sc.add(hg);
    const h={g:hg,hb:{meta:{cut:{x:0,y:0,z:0}}},rec:{c:{boss:k,name:'x'}}};
    const b={type:'syn_'+k,x:0,z:0,rot:0,g,heads:[h],timer:0}; G.builds=[b];
    // 断言：accept 只收本地区霸主
    const okA=d.mount.accept(h)&&!d.mount.accept({rec:{c:{boss:'peak'==k?'village':'peak'}}});
    let t=0; const T=POKE?1.0:7.3; if(POKE){ G.clock.elapsedTime=5; RegEcon._dbg.onE({build:b},null,false); t=5; }
    for(let i=0;i<Math.round((POKE?0.6:T)/0.02);i++){ t+=0.02; G.clock.elapsedTime=t; RegEcon._dbg.tick(0.02,t); }
    if(k==='forest') console.log('RES fl='+g.userData.fl.length);
    const fp=d.fp; const cam=new THREE.PerspectiveCamera(40,1,0.01,50); const top=(d.mount.slots[0][1]||1);
    const CL=location.hash.includes('close')?0.55:location.hash.includes('far')?1.7:1; cam.position.set(1.3*CL,top*0.8+0.8*CL,2.3*CL); cam.lookAt(0,Math.max(0.4,top*0.55),0); R.render(sc,cam);
    const el=document.createElement('div'); el.innerHTML=`<img src="${R.domElement.toDataURL()}"><br>${k} ${d.n} seat=${d.mount.slots[0].map(v=>v.toFixed(2))} accept=${okA}`; grid.appendChild(el);
  }
  console.log('RES got='+(window.__got||0)+' toast='+(window.__toast||'').slice(0,40)+' tip='+String(RegEcon._dbg.onTip({build:G.builds[0]},null)).slice(0,80));
  document.title='done';
})().catch(e=>{console.log('RES ERR '+e.stack);document.title='done';});
</script></body></html>
