<!doctype html><meta charset="utf-8"><title>head cut-surface viewer</title><base href="/">
<!-- R37：非 VRoid 头断面（脖子切口）目检台：?list=CLS_Kafka,GI_Ganyu,... 每个头一格，从下往上看切面。window.__cut(view) 返回信息，画布 #cv 用 cap.py 截图。 -->
<body style="margin:0;background:#222"><canvas id="cv" width="640" height="640" style="width:640px;height:640px"></canvas>
<script src="/lib/three.min.js"></script><script src="/lib/GLTFLoader.js"></script>
<script src="/js/mods.js"></script><script src="/js/hair_cover.js"></script>
<script>
const q = new URLSearchParams(location.search); const hideK = (q.get('hide') || '').split(','); const list = (q.get('list') || '').split(',').filter(Boolean);
window.HEAD_MODELS = window.HEAD_MODELS || [];
document.write('<script src="/js/heads.js"><\/script>');
for (const n of list) document.write('<script src="/models/' + n + '.js"><\/script>');
</script>
<script>
window.__cut = async function (view) {
  const cv = document.getElementById('cv'); const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(640, 640, false); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setScissorTest(true);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x58626e);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8078, 1.3)); const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1, 2, 3); scene.add(dl);
  await ModelHeads.init();
  const files = ModelHeads.files(); const info = [];
  const cam = new THREE.PerspectiveCamera(30, 1, 0.02, 20);
  files.forEach((f, i) => {
    const base = ModelHeads.randomLook(() => 0.5, {}, 0); const look = Object.assign({}, base, { f, h: f });
    let hb; try { hb = ModelHeads.create(look); } catch (e) { info.push(f + ' ERR ' + e.message); return; }
    const g = hb.group; scene.add(g); g.traverse(m => { if (m.isMesh && hideK.includes(m.userData.kind || m.name)) m.visible = false; }); g.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(g), c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
    info.push(f + ' grp=' + (hb.meta && hb.meta.grp) + ' size=' + sz.toArray().map(v => v.toFixed(2)).join('x') + ' bottom=' + bb.min.y.toFixed(3));
    const NC = files.length === 1 ? 1 : files.length <= 4 ? 2 : 3, W = 640 / NC, col = i % NC, row = Math.floor(i / NC); renderer.setViewport(col * W, 640 - (row + 1) * W, W, W); renderer.setScissor(col * W, 640 - (row + 1) * W, W, W);
    const r = view === 'neck' ? 0.36 : Math.max(sz.x, sz.y, sz.z) * 1.7; const pit = view === 'front' ? 0.15 : view === 'side' ? -0.1 : view === 'under' ? -1.2 : view === 'neck' ? -0.75 : -0.45; const yaw = view === 'side' ? 1.3 : 0.5;
    const tgt = new THREE.Vector3(c.x, view === 'front' ? c.y : view === 'neck' ? bb.min.y + 0.05 : bb.min.y + sz.y * 0.25, c.z);
    cam.position.set(tgt.x + Math.sin(yaw) * Math.cos(pit) * r, tgt.y + Math.sin(pit) * r, tgt.z + Math.cos(yaw) * Math.cos(pit) * r); cam.lookAt(tgt);
    renderer.render(scene, cam); scene.remove(g); hb.dispose && hb.dispose();
  });
  return info.join('\n');
};
</script>
<script>
window.__metric = async function () {
  await ModelHeads.init(); const out = [];
  for (const f of ModelHeads.files()) {
    const base = ModelHeads.randomLook(() => 0.5, {}, 0); const look = Object.assign({}, base, { f, h: f });
    let hb; try { hb = ModelHeads.create(look); } catch (e) { out.push(f + ' ERR'); continue; }
    const g = hb.group; g.updateMatrixWorld(true); const M = {}; const v = new THREE.Vector3();
    g.traverse(m => { if (!m.isMesh) return; const k = m.userData.kind || (m.name || '?'); const a = m.geometry.attributes.position; const r = M[k] || (M[k] = { n: 0, y0: 1e9, pts: [] });
      for (let i = 0; i < a.count; i++) { v.fromBufferAttribute(a, i).applyMatrix4(m.matrixWorld); r.n++; r.y0 = Math.min(r.y0, v.y); r.pts.push(v.x, v.y, v.z); } });
    const cut = M.cut; const kinds = Object.keys(M).map(k => k + ':' + M[k].y0.toFixed(3)).join(',');
    if (!cut) { out.push(f + ' NOCUT kinds=' + kinds); hb.dispose && hb.dispose(); continue; }
    let cy = 0, n = 0, x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9; for (let i = 0; i < cut.pts.length; i += 3) { cy += cut.pts[i + 1]; n++; x0 = Math.min(x0, cut.pts[i]); x1 = Math.max(x1, cut.pts[i]); z0 = Math.min(z0, cut.pts[i + 2]); z1 = Math.max(z1, cut.pts[i + 2]); } cy /= n;
    let low = 0, nx0 = 1e9, nx1 = -1e9, nz0 = 1e9, nz1 = -1e9, nn = 0;
    for (const k in M) { if (k === 'cut' || k === 'hair') continue; const P = M[k].pts; for (let i = 0; i < P.length; i += 3) { if (P[i + 1] < cy - 0.006) low++; else if (P[i + 1] < cy + 0.03) { nn++; nx0 = Math.min(nx0, P[i]); nx1 = Math.max(nx1, P[i]); nz0 = Math.min(nz0, P[i + 2]); nz1 = Math.max(nz1, P[i + 2]); } } }
    const cw = x1 - x0, cd = z1 - z0, nw = nx1 - nx0, nd = nz1 - nz0;
    const fl = []; if (low > 0) fl.push('SKIN-BELOW:' + low); if (nn && (cw < nw * 0.85 || cd < nd * 0.85)) fl.push('CUT-SMALL'); if (nn && (cw > nw * 1.25 || cd > nd * 1.25)) fl.push('CUT-BIG'); if (cw < 0.03) fl.push('TINY');
    out.push(f + ' cut=' + cw.toFixed(3) + 'x' + cd.toFixed(3) + ' neck=' + nw.toFixed(3) + 'x' + nd.toFixed(3) + ' y=' + cy.toFixed(3) + ' ' + fl.join(' ') + ' | ' + Object.keys(M).join(','));
    hb.dispose && hb.dispose();
  }
  return out.join('\n');
};
</script>
<script>window.__dbg = async function () { await ModelHeads.init(); return ModelHeads.cutDbg().join('\n'); };</script>
<script>
window.__skin = async function () {
  await ModelHeads.init(); const out = [];
  for (const f of ModelHeads.files()) {
    const base = ModelHeads.randomLook(() => 0.5, {}, 0); const look = Object.assign({}, base, { f, h: f });
    let hb; try { hb = ModelHeads.create(look); } catch (e) { continue; }
    const g = hb.group; g.updateMatrixWorld(true); const bs = new THREE.Box3(), ba = new THREE.Box3(); let hs = false;
    g.traverse(m => { if (!m.isMesh) return; const k = m.userData.kind; const b = new THREE.Box3().setFromObject(m); ba.union(b); if (k === 'skin') { bs.union(b); hs = true; } });
    const s = bs.getSize(new THREE.Vector3()), a = ba.getSize(new THREE.Vector3());
    out.push(f + ' grp=' + (hb.meta && hb.meta.grp) + ' skin=' + s.x.toFixed(3) + 'x' + s.y.toFixed(3) + ' all=' + a.y.toFixed(3));
    hb.dispose && hb.dispose();
  }
  return out.join('\n');
};
</script>
