<!doctype html><html><head><meta charset="utf-8"><title>wterrain test</title><style>body{margin:0;background:#111}canvas{display:block}</style></head><body>
<!-- R46：地形特色化测试：9 个地区各一张（同一地点种子 ?s=1），看地貌 + 坡度贴岩。?s=2 换种子；?wt=0 看原地形 -->
<script src="../../lib/three.min.js"></script><script src="../../lib/GLTFLoader.js"></script><script src="../../js/assets.js"></script>
<script src="../../big/world/tex_leafy_grass.js"></script><script src="../../big/world/tex_aerial_rocks_02.js"></script><script src="../../big/world/tex_cliff_side.js"></script><script src="../../big/world/tex_rock_face_03.js"></script>
<script src="../../js/wterrain.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search), S0 = +(q.get('s') || 1), CW = 480, CH = 270, regs = (q.get('r') || 'meadow,forest,wilds,ruins,swamp,fortress,capital,abyss,peak').split(',');
  await Assets.init(); const grass = Assets.tex('leafy_grass');
  const R = new THREE.WebGLRenderer({ antialias: true }); R.setSize(CW, CH); R.outputEncoding = THREE.sRGBEncoding; R.toneMapping = THREE.ACESFilmicToneMapping;
  const cols = 3, out = document.createElement('canvas'); out.width = CW * cols; out.height = CH * Math.ceil(regs.length / cols); document.body.appendChild(out); const c2 = out.getContext('2d');
  const errs = []; const ce = console.error; console.error = (...a) => { errs.push(String(a[0]).slice(0, 300)); ce(...a); };
  const hash = (x, y, s) => { let n = (x * 374761393 + y * 668265263 + s * 69069) | 0; n = Math.imul(n ^ (n >>> 13), 1274126177); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
  const mk = (s) => { const v = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), w = yf * yf * (3 - 2 * yf); return (hash(xi, yi, s) * (1 - u) + hash(xi + 1, yi, s) * u) * (1 - w) + (hash(xi, yi + 1, s) * (1 - u) + hash(xi + 1, yi + 1, s) * u) * w; }; return (x, y) => v(x, y) * 0.55 + v(x * 2.1 + 17, y * 2.1 - 5) * 0.3 + v(x * 4.3 - 9, y * 4.3 + 3) * 0.15; };
  const sst = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const info = [];
  for (let idx = 0; idx < regs.length; idx++) { const rg = regs[idx];
    const seed = (S0 * 7919 + idx * 104729) >>> 0, nz = mk(seed & 0xffff), Rr = 26, hill = { meadow: 7, forest: 9, wilds: 11, ruins: 6, swamp: 5, fortress: 8, capital: 4, abyss: 9, peak: 12 }[rg] || 7;
    const doors = [0, 2.1, 4.2].map((a, i) => ({ x: Math.cos(a + S0) * (Rr - 0.6), z: Math.sin(a + S0) * (Rr - 0.6), a: a + S0 }));
    const flat = (x, z) => { let f = 1; for (const d of doors) f = Math.min(f, sst(2.5, 6, Math.hypot(x - d.x, z - d.z))); return f; };
    const H0 = (x, z) => { const rr = Math.hypot(x, z); return (nz(x * 0.06 + 50, z * 0.06 + 50) - 0.5) * 1.6 * sst(0, 5, rr) * flat(x, z) + hill * sst(Rr + 0.5, Rr + 16, rr) * (0.55 + 0.9 * nz(Math.cos(Math.atan2(z, x)) * 3 + 9, Math.sin(Math.atan2(z, x)) * 3 + 9)) + hill * 1.2 * sst(Rr + 20, Rr + 60, rr); };
    const node = { seed, style: rg }, g = { tag: [] };
    const H = WTerrain.wrap(H0, { node, st: {}, R: Rr, Rmin: Rr, doorList: doors, LY: { k: 'none' }, g, flat });
    const sz = 150, seg = 150, geo = new THREE.PlaneGeometry(sz, sz, seg, seg); geo.rotateX(-Math.PI / 2); const p = geo.attributes.position; let mn = 9, mx = -9;
    for (let i = 0; i < p.count; i++) { const y = H(p.getX(i), p.getZ(i)); p.setY(i, y); if (Math.hypot(p.getX(i), p.getZ(i)) < Rr) { mn = Math.min(mn, y); mx = Math.max(mx, y); } } geo.computeVertexNormals();
    info.push(rg + ' ' + (node._wt || []).join('+') + ' relief ' + mn.toFixed(1) + '..' + mx.toFixed(1));
    const rk = WTerrain.rock(node), rset = Assets.tex(rk.name);
    const mat = Assets.triplanar(grass, { scale: 0.35, normal: 1.1, env: 0.35, ao: 0.9, macro: 2, rock: rset, rockTint: rk.tint });
    const sc = new THREE.Scene(); sc.background = new THREE.Color('#a9bccb'); sc.fog = new THREE.FogExp2('#a9bccb', 0.008); sc.add(new THREE.Mesh(geo, mat));
    const sun = new THREE.DirectionalLight('#fff1dc', 2.0); sun.position.set(40, 38, 25); sc.add(sun); sc.add(new THREE.HemisphereLight('#b8ccdd', '#554433', 0.5));
    const cam = new THREE.PerspectiveCamera(58, CW / CH, 0.1, 500); const ca = S0 * 1.3 + idx; cam.position.set(Math.cos(ca) * 38, 17, Math.sin(ca) * 38); cam.lookAt(0, 0.5, 0);
    R.render(sc, cam); await new Promise(r => setTimeout(r, 120)); R.render(sc, cam); c2.drawImage(R.domElement, (idx % cols) * CW, Math.floor(idx / cols) * CH); c2.fillStyle = '#000a'; c2.fillRect((idx % cols) * CW, Math.floor(idx / cols) * CH, 330, 20); c2.fillStyle = '#fff'; c2.font = '14px sans-serif'; c2.fillText(info[idx], (idx % cols) * CW + 6, Math.floor(idx / cols) * CH + 15);
  }
  window.__done = { errs, info };
})();
</script></body></html>
