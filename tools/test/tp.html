<script>
const V3=THREE.Vector3;
async function show(names){
 const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('cv'),antialias:true});renderer.setSize(960,540,false);renderer.setClearColor(0x333844);
 const sc=new THREE.Scene();sc.add(new THREE.HemisphereLight(0xffffff,0x555555,1.3));const dl=new THREE.DirectionalLight(0xffffff,1.2);dl.position.set(2,4,3);sc.add(dl);
 const cam=new THREE.PerspectiveCamera(35,16/9,0.1,50);cam.position.set(0,1.1,6.2);cam.lookAt(0,0.95,0);
 await ModelHeads.init(); await Foe.loadAnim();
 const S={eq:{weapon:0},stats:{},bosses:{}};const res=[];
 let i=0;for(const n of names){
  const h=RPG.foe(S,Lore.LOCS[0],100+i,new Set(),new Set());
  const look=Object.assign({},h.look||ModelHeads.randomLook(()=>0.5,0,0),{skinHex:'#6b8f45'});
  const f=await Foe.build(n,look,{});const T=await Foe.template(n);
  f.root.position.set((i-(names.length-1)/2)*1.25,0,0);
  f.root.traverse(o=>{if(o.isMesh&&o.material&&o.material.userData&&o.material.userData.skin&&o.material.color)o.material.color.set(0x6b8f45);});
  sc.add(f.root);await Foe.animate(f);f.play('Sword_Idle');f.mixer.update(0.3);res.push(n+':'+(!!T.skin));i++;}
 renderer.render(sc,cam);return res;}
