<!doctype html><html><head><meta charset="utf-8"><title>overhear portrait test</title><style>body{margin:0;background:#222;color:#fff;font:14px sans-serif}img{border:1px solid #888;margin:4px;background:#345}</style></head><body>
<!-- R46：偷听头像渲染测试（HDR 线性 RT 路径 vs 旧 sRGB 路径），不依赖整个游戏 -->
<script src="../../lib/three.min.js"></script><script src="../../js/overhear.js"></script>
<script>
(async () => {
  const T = THREE, R = new T.WebGLRenderer({ antialias: true }); R.setSize(200, 200); R.outputEncoding = T.sRGBEncoding; R.toneMapping = T.ACESFilmicToneMapping; document.body.appendChild(R.domElement);
  const sc = new T.Scene(); sc.background = new T.Color('#88a'); sc.fog = new T.FogExp2('#88a', 0.05);
  const sun = new T.DirectionalLight('#fff1dc', 2); sun.position.set(3, 6, 4); sc.add(sun, new T.HemisphereLight('#b8ccdd', '#554433', 0.5));
  sc.add(new T.Mesh(new T.PlaneGeometry(50, 50).rotateX(-Math.PI / 2), new T.MeshStandardMaterial({ color: '#486' })));
  const top = new T.Group(), body = new T.Mesh(new T.CapsuleGeometry(0.25, 0.8, 4, 12), new T.MeshStandardMaterial({ color: '#c33' })); body.position.y = 0.9;
  const head = new T.Mesh(new T.SphereGeometry(0.16, 24, 16), new T.MeshStandardMaterial({ color: '#fcb' })); head.position.y = 1.55;
  top.add(body, head); top.rotation.y = 0.7; sc.add(top); const names = []; const c = { name: 'T' };
  window.G = { renderer: R, scene: sc, post: { on: !/nopost/.test(location.search) } };
  window.Foe = { foes: [{ h: { c }, f: { root: top, bones: { head } } }] };
  const inst = Overhear; const t0 = performance.now(); const url = inst.portraitOf(c); const dt = performance.now() - t0;
  const im = new Image(); im.src = url || ''; document.body.appendChild(im);
  const d = document.createElement('div'); d.id = 'res'; d.textContent = 'url=' + (url ? url.length : null) + ' ms=' + dt.toFixed(1) + ' fog=' + sc.fog.density + ' tm=' + R.toneMapping + ' vis=' + top.visible + ' sau=' + R.shadowMap.autoUpdate; document.body.appendChild(d);
  R.render(sc, new T.PerspectiveCamera(50, 1, 0.1, 50).translateZ(3).translateY(1.2));
  window.DONE = 1;
})();
</script></body></html>
