<!doctype html><meta charset="utf-8"><title>head puzzle viewer</title><base href="/">
<!-- R38：head_puzzle 目检台：?pz=0|1&faces=GI_HuTao,..&donors=..（总数 ≤12）。__run() 返回每个脸选到的发型；画布 #cv 用 cap 截图 -->
<body style="margin:0;background:#222"><canvas id="cv" width="640" height="640" style="width:640px;height:640px"></canvas>
<script src="/lib/three.min.js"></script><script src="/lib/GLTFLoader.js"></script>
<script>
const q = new URLSearchParams(location.search); const faces = (q.get('faces') || 'GI_HuTao,GI_Eula,GI_YaeMiko,GI_RaidenShogun').split(','), donors = (q.get('donors') || 'AvatarSample_A,AvatarSample_K,GI_Jean,GI_Mona,CLS_Mokou,GI_Nilou,CLS_RemTda').split(',').filter(Boolean);
const st = { __v: 10, head_puzzle: q.get('pz') !== '0', hair_mix2: true, acc_mix: true, head_native: false }; localStorage.setItem('soulhead_mods', JSON.stringify(st));
</script>
<script src="/js/mods.js"></script><script src="/js/hair_cover.js"></script>
<script>
window.HEAD_MODELS = window.HEAD_MODELS || [];
document.write('<script src="/js/heads.js"><\/script>');
for (const n of faces.concat(donors)) document.write('<script src="/models/' + n + '.js"><\/script>');
</script>
<script>
window.__run = async function () {
  const cv = document.getElementById('cv'); const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(640, 640, false); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setScissorTest(true);
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x58626e);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8078, 1.3)); const dl = new THREE.DirectionalLight(0xffffff, 1.6); dl.position.set(1, 2, 3); scene.add(dl);
  await ModelHeads.init(); const info = [], cam = new THREE.PerspectiveCamera(30, 1, 0.02, 20);
  const fs = ModelHeads.files().filter(f => faces.includes(f)); const NC = 2, W = 320;
  fs.forEach((f, i) => {
    const base = ModelHeads.randomLook(() => 0.5, {}, 2); const look = Object.assign({}, base, { f, h: f, seed: 11 + i * 7, ax: undefined });
    let hb; try { hb = ModelHeads.create(look); } catch (e) { info.push(f + ' ERR ' + e.message); return; }
    const g = hb.group; scene.add(g); g.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(g), c = bb.getCenter(new THREE.Vector3()), sz = bb.getSize(new THREE.Vector3());
    info.push(f + ' -> hair ' + (ModelHeads.hairOf ? ModelHeads.hairOf(look) : '?') + ' size=' + sz.toArray().map(v => v.toFixed(2)).join('x'));
    const col = i % NC, row = Math.floor(i / NC); renderer.setViewport(col * W, 640 - (row + 1) * W, W, W); renderer.setScissor(col * W, 640 - (row + 1) * W, W, W);
    const r = Math.max(sz.x, sz.y, sz.z) * 2.0, yaw = 0.4;
    cam.position.set(c.x + Math.sin(yaw) * r, c.y + 0.05, c.z + Math.cos(yaw) * r); cam.lookAt(c.x, c.y, c.z);
    renderer.render(scene, cam); scene.remove(g); hb.dispose && hb.dispose();
  });
  return info.join('\n');
};
</script>
