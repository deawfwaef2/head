<!doctype html><html><body style="margin:0;background:#556">
<script src="lib/three.min.js"></script>
<script>window.SFX={play(){},thud(){}};</script>
<script src="js/combat.js"></script>
<script>
const R=new THREE.WebGLRenderer({preserveDrawingBuffer:true}); R.setSize(innerWidth,innerHeight); document.body.appendChild(R.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#445'); const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.01,100); scene.add(cam);
const vm=new THREE.Group(); cam.add(vm); const w=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.8,0.01).translate(0,0.4,0),new THREE.MeshBasicMaterial({color:'#ddd'})); w.userData.len=0.8; vm.add(w);
scene.add(new THREE.AmbientLight('#fff',1));
const G={camera:cam,vm,weapon:w,fist:null,scene,S:{eq:{}},player:{pos:new THREE.Vector3()},heads:[],toast(){},kick(){},burst(){}};
Combat.init(G); Combat.toggle(true); const S=Combat.state;
window.__run=(gAng,threats)=>{ S.rmb=true; S.guard.x=Math.cos(gAng); S.guard.y=Math.sin(gAng); Combat.setThreats(()=>threats); for(let i=0;i<40;i++) Combat.update(1/60, i/60); R.render(scene,cam); };
window.__ready=true;
</script></body></html>
